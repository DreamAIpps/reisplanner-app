name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # De tests draaien tegen een echte Postgres, niet tegen namaak. De bugs die
    # er dit jaar uit kwamen — dubbele dagen, een gebruiker die niet te
    # verwijderen was — waren alleen met een echte database zichtbaar.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: reisplanner_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/reisplanner_test
