<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inloggen — Reisplanner</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#FF7A00" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #F4F2EF; margin: 0; -webkit-font-smoothing: antialiased;
      font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    }
    .display { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-weight: 400; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-8 w-full max-w-sm" style="border:1px solid #E6E0DA;box-shadow:0 18px 44px -30px rgba(36,29,25,.45)">
    <div class="text-center mb-7">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#B85800" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 14px" aria-hidden="true">
        <path d="M3 13.5 21 7l-4.5 12-3.2-5.1z" /><path d="M13.3 13.9 21 7" />
      </svg>
      <h1 class="display text-3xl" style="color:#241D19">Reisplanner</h1>
      <p class="text-sm mt-1.5" style="color:#7B6E67">Log in om je reizen te bekijken</p>
    </div>

    <div id="error" class="hidden bg-red-50 text-red-700 text-sm px-3 py-2 rounded-lg mb-4"></div>
    <div id="success" class="hidden bg-green-50 text-green-700 text-sm px-3 py-2 rounded-lg mb-4"></div>

    <div>
      <a href="/auth/google"
        class="flex items-center justify-center gap-3 w-full rounded-full px-4 py-3 text-sm font-medium transition-colors mb-3" style="border:1px solid #E6E0DA;color:#463D38">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Doorgaan met Google
      </a>

      <button id="apple-btn" type="button" onclick="handleAppleSignIn()"
        class="flex items-center justify-center gap-3 w-full rounded-full px-4 py-3 text-sm font-medium text-white transition-colors mb-3 disabled:opacity-50" style="background:#241D19">
        <svg width="18" height="18" viewBox="0 0 814 1000" fill="white"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-37.5-155.5-127.4C46.7 790.7 0 663 0 541.8c0-207.8 135.4-317.7 268.4-317.7 70.1 0 128.4 46.4 173 46.4 42.8 0 109.2-49 192.4-49 30.9 0 111.2 2.6 168.1 98.4zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/></svg>
        Doorgaan met Apple
      </button>

      <p class="text-center text-xs mt-5 leading-relaxed" style="color:#A99C93">
        Inloggen gaat via Google of Apple. Had je een account met e-mail en wachtwoord?
        Log in met Google met datzelfde e-mailadres — je reizen staan er gewoon nog.
      </p>
    </div>
  </div>

  <script>
    const _params = new URLSearchParams(location.search);
    const _err = _params.get('error');
    if (_err === 'apple-config') {
      showError('Apple Sign In is niet geconfigureerd op de server. Gebruik Google om in te loggen.');
    } else if (_err === 'apple-no-token') {
      showError('Apple stuurde geen authenticatietoken. Probeer het opnieuw.');
    } else if (_err === 'apple-verify-expired') {
      showError('Apple token is verlopen. Probeer opnieuw in te loggen.');
    } else if (_err === 'apple-verify-jwk') {
      showError('Apple sleutel niet herkend. Probeer het over een minuut opnieuw.');
    } else if (_err === 'apple-verify-invalid') {
      showError('Apple token ongeldig. Probeer het opnieuw of gebruik Google.');
    } else if (_err === 'apple-db') {
      showError('Fout bij opslaan gebruikersgegevens. Probeer het opnieuw.');
    } else if (_err && _err.startsWith('apple-')) {
      showError('Apple Sign In mislukt (' + _err.replace('apple-', '') + '). Probeer Google.');
    } else if (_err) {
      showError('Er ging iets mis. Probeer het opnieuw.');
    }


    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('success').classList.add('hidden');
    }

    function hideMessages() {
      document.getElementById('error').classList.add('hidden');
      document.getElementById('success').classList.add('hidden');
    }

    async function handleAppleSignIn() {
      const btn = document.getElementById('apple-btn');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = 'Bezig...';
      hideMessages();
      try {
        const cfgRes = await fetch('/auth/apple/client-id');
        const cfg = await cfgRes.json();
        if (!cfg.clientId) {
          showError('Apple Sign In is niet geconfigureerd op de server. Gebruik Google.');
          return;
        }
        AppleID.auth.init({
          clientId: cfg.clientId,
          scope: 'name email',
          redirectURI: window.location.origin + '/auth/apple/callback',
          usePopup: true,
        });
        const response = await AppleID.auth.signIn();
        const idToken = response.authorization?.id_token;
        if (!idToken) { showError('Apple stuurde geen token. Probeer het opnieuw.'); return; }
        const res = await fetch('/auth/apple/js-callback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_token: idToken, name: response.user?.name || null }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          window.location.href = '/';
        } else {
          const code = data.error || '';
          if (code === 'apple-verify-expired') showError('Apple token is verlopen. Probeer opnieuw in te loggen.');
          else if (code === 'apple-verify-jwk') showError('Apple sleutel niet herkend. Probeer het over een minuut opnieuw.');
          else if (code === 'apple-verify-invalid') showError('Apple token ongeldig. Probeer het opnieuw of gebruik Google.');
          else if (code === 'apple-db') showError('Fout bij opslaan gebruikersgegevens. Probeer het opnieuw.');
          else showError('Apple Sign In mislukt. Probeer Google.');
        }
      } catch (err) {
        if (err && (err.error === 'popup_closed_by_user' || err.error === 'user_trigger_new_signin_flow')) {
          // User dismissed popup — no error
        } else {
          console.error('Apple Sign In error:', err);
          showError('Apple Sign In mislukt. Probeer het opnieuw.');
        }
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    }


  </script>
</body>
</html>
