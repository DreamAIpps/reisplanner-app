<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reisplanner</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reisplanner" />
  <meta name="theme-color" content="#FCFAF8" />
  <meta property="og:title" content="Reisplanner" />
  <meta property="og:description" content="Jouw reizen, overzichtelijk gepland" />
  <meta property="og:image" content="/icon-512.png" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* Zacht perzik. De schaal heet nog sky zodat alle bestaande klassen blijven
       werken, maar loopt nu netjes van licht naar donker binnen één warme
       familie — dat is nodig omdat sky-600/700 in de app vaker als tekstkleur
       dan als vlak gebruikt worden en dus leesbaar op wit moeten blijven.

         50-200  zachte vlakken en tinten (Primary Soft)
         300     Primary — de pastel waar knoppen en accenten op staan
         400     Coral — voorbehouden aan "nieuw", "vandaag" en focusringen
         600/700 de enige tinten donker genoeg voor accenttekst op wit
                 (contrast 4.9 resp. 6.6)

       De grijzen zijn de warme neutralen uit het ontwerpsysteem: 50 is de
       achtergrond, 100 het secundaire vlak, 200 de rand, 500 secundaire tekst
       en 800 primaire tekst. */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sky: {
              50: "#FDF3F0", 100: "#FBEAE5", 200: "#F7DDD5", 300: "#F3C2B5",
              400: "#E98C7D", 500: "#D97565", 600: "#AC5947", 700: "#8C4A3F",
              800: "#6E3A31", 900: "#522B24",
            },
            gray: {
              50: "#FCFAF8", 100: "#F8F5F3", 200: "#ECE6E2", 300: "#C7C1BC",
              400: "#A9A29D", 500: "#7B7571", 600: "#635D59", 700: "#4A4643",
              800: "#373432", 900: "#2A2725",
            },
            /* Zachte statuskleuren — alleen voor betekenis, nooit als accent. */
            good: "#A8C7B3",
            info: "#B8D6E8",
            accent: "#F6E2A7",
            coral: "#E98C7D",
          },
          fontFamily: {
            display: ['"Plus Jakarta Sans"', "ui-sans-serif", "-apple-system", '"Segoe UI"', "system-ui", "sans-serif"],
            num: ['"Plus Jakarta Sans"', "ui-sans-serif", "-apple-system", "system-ui", "sans-serif"],
          },
          /* Klein 12 · Middel 16 · Groot 20 · XL 28 · Pil 999. De bestaande
             klassennamen schuiven mee omhoog, zodat kaarten (rounded-2xl) in
             één keer op 24px uitkomen zonder 200 classNames aan te raken. */
          borderRadius: {
            sm: "6px", DEFAULT: "8px", md: "10px", lg: "12px",
            xl: "16px", "2xl": "24px", "3xl": "28px",
          },
          /* Nauwelijks zichtbaar en warm getint — liever een rand dan hoogte. */
          boxShadow: {
            sm: "0 1px 2px rgba(55,52,50,0.04)",
            DEFAULT: "0 1px 3px rgba(55,52,50,0.05)",
            md: "0 2px 8px rgba(55,52,50,0.05)",
            lg: "0 4px 16px rgba(55,52,50,0.06)",
            xl: "0 8px 28px rgba(55,52,50,0.07)",
            "2xl": "0 12px 40px rgba(55,52,50,0.08)",
          },
          /* Ingetogen beweging. 220ms is de standaard voor elk element dat al
             een transition-klasse heeft, dus losse duration-klassen zijn de
             uitzondering en niet de regel. */
          transitionDuration: { DEFAULT: "220ms", fast: "120ms", normal: "220ms", slow: "320ms" },
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.3/babel.min.js"></script>
  <script src="https://unpkg.com/exif-js@2.3.0/exif.js"></script>
  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('js-error');
      if (el) { el.style.display = 'block'; el.querySelector('p').textContent = msg + ' (' + (src||'') + ':' + line + ')'; }
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('js-error');
      if (el) { el.style.display = 'block'; el.querySelector('p').textContent = (e.reason && e.reason.message) || String(e.reason); }
    });
  </script>
  <style>
    .leaflet-reisplanner-icon { background: none !important; border: none !important; }
    /* Compact activiteit-label op de dagboek-kaart — Leaflets standaard tooltip
       is te fors (6px padding, schaduw, pijltje) voor een klein kaartje vol stippen. */
    .leaflet-reisplanner-tooltip {
      padding: 2px 7px; font-size: 11px; line-height: 1.5; border-radius: 6px;
      border: none; box-shadow: 0 1px 3px rgba(55,52,50,.18);
    }
    * { box-sizing: border-box; }
    /* Tailwinds tekstschaal (text-xs t/m text-2xl) is in rem, dus deze ene regel
       maakt alle lopende tekst iets groter zonder dat elke className aangepast
       hoeft te worden. Iconen en de handvol vaste px-groottes (dagnummers,
       kopjes) staan hier los van en zijn apart iets vergroot waar dat las. */
    html { font-size: 18px; }
    body {
      background: #FCFAF8; margin: 0; color: #373432;
      font-family: "Plus Jakarta Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ECE6E2; border-radius: 999px; }
    /* Cijfers die onder elkaar horen te staan — tijden, bedragen, dagnummers. */
    .tnum { font-variant-numeric: tabular-nums; }
    /* Dubbeltik-waardering in de fotoviewer — hetzelfde duimpje als de like-knop
       elders, alleen groot en even opvallend in beeld. */
    @keyframes rp-heartpop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); }
      22%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05) rotate(2deg); }
      32%  { transform: translate(-50%, -50%) scale(.96) rotate(0deg); }
      78%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05) rotate(0deg); }
    }
    .rp-heartpop { animation: rp-heartpop .7s cubic-bezier(.2,1.4,.4,1) forwards; }
    /* Slingers bij het eindscherm van de fotoquiz — vallen één keer naar
       beneden en blijven op hun eindpositie hangen (forwards), geen loop. */
    @keyframes rp-streamer-fall {
      0%   { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(540deg); opacity: .85; }
    }
    .rp-streamer { position: fixed; top: 0; width: 8px; height: 26px; border-radius: 2px; pointer-events: none; animation: rp-streamer-fall linear forwards; }
    /* Tussenstand-rijen die één voor één opbouwen, van de laatste plek naar
       boven — de animation-delay per rij (zie inline style) bepaalt de
       volgorde, dit keyframe is voor iedere rij hetzelfde. */
    @keyframes rp-row-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .rp-standings-row { animation: rp-row-in .35s ease-out both; }
    /* Onbepaalde voortgangsbalk tijdens het samenstellen van de fotoboek-PDF
       (fase waarin de server nog geen totale bestandsgrootte kan geven) — een
       blokje dat heen en weer glijdt, net als bekende indeterminate-balken. */
    @keyframes rp-pdf-indeterminate {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
    .rp-pdf-indeterminate { animation: rp-pdf-indeterminate 1.1s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="js-error" style="display:none;position:fixed;inset:0;background:#FCFAF8;z-index:9999;padding:32px">
    <div style="max-width:400px;margin:0 auto;text-align:center;padding-top:60px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8C4A3F" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 16px">
        <circle cx="12" cy="12" r="9" /><path d="M12 7.5v5" /><path d="M12 16.2h.01" />
      </svg>
      <h2 style="color:#373432;margin-bottom:8px;font-weight:600">Er ging iets mis</h2>
      <p style="color:#7B7571;font-size:14px;margin-bottom:24px;word-break:break-all"></p>
      <button onclick="window.location.reload()" style="background:#F3C2B5;color:#373432;border:none;padding:14px 28px;border-radius:16px;font-size:14px;font-weight:600;cursor:pointer">Pagina herladen</button>
    </div>
  </div>
  <div id="root"></div>
  <script type="text/babel" src="app.js?v=213"></script>
</body>
</html>
