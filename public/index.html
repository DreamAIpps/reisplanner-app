<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reisplanner</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reisplanner" />
  <meta name="theme-color" content="#FFF9F6" />
  <meta property="og:title" content="Reisplanner" />
  <meta property="og:description" content="Jouw reizen, overzichtelijk gepland" />
  <meta property="og:image" content="/icon-512.png" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/app.css?v=266" />
  <link rel="stylesheet" href="/vendor/leaflet.css" />
  <script src="/vendor/leaflet.js"></script>
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script src="/vendor/exif.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <script src="/vendor/purify.js"></script>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('js-error');
      if (el) { el.style.display = 'block'; el.querySelector('p').textContent = msg + ' (' + (src||'') + ':' + line + ')'; }
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('js-error');
      if (el) { el.style.display = 'block'; el.querySelector('p').textContent = (e.reason && e.reason.message) || String(e.reason); }
    });
  </script>
</head>
<body>
  <div id="js-error" style="display:none;position:fixed;inset:0;background:#FCFAF8;z-index:9999;padding:32px">
    <div style="max-width:400px;margin:0 auto;text-align:center;padding-top:60px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8C4A3F" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 16px">
        <circle cx="12" cy="12" r="9" /><path d="M12 7.5v5" /><path d="M12 16.2h.01" />
      </svg>
      <h2 style="color:#373432;margin-bottom:8px;font-weight:600">Er ging iets mis</h2>
      <p style="color:#7B7571;font-size:14px;margin-bottom:24px;word-break:break-all"></p>
      <button onclick="window.location.reload()" style="background:#F3C2B5;color:#373432;border:none;padding:14px 28px;border-radius:16px;font-size:14px;font-weight:600;cursor:pointer">Pagina herladen</button>
    </div>
  </div>
  <div id="root"></div>
  <script src="/app.js?v=266"></script>
</body>
</html>
